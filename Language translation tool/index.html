<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translation Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


<div class="container">
    <h1>Language Translation Tool</h1>
    <p class="subtitle">Translate text into different languages</p>

    <div class="language-selection">
        <div>
            <label>Source Language</label>
            <select id="sourceLanguage">
                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="fr">French</option>
                <option value="es">Spanish</option>
                <option value="de">German</option>
            </select>
        </div>

        <button id="swapButton">⇄</button>

        <div>
            <label>Target Language</label>
            <select id="targetLanguage">
                <option value="hi">Hindi</option>
                <option value="en">English</option>
                <option value="fr">French</option>
                <option value="es">Spanish</option>
                <option value="de">German</option>
            </select>
        </div>
    </div>

    <label>Enter Text</label>
    <textarea id="inputText" placeholder="Type text here..."></textarea>

    <button id="translateButton">Translate</button>

    <div class="result-box">
        <h3>Translated Text</h3>
        <p id="translatedText">Your translation will appear here.</p>

        <div class="actions">
            <button id="copyButton">Copy</button>
            <button id="speakButton">🔊 Listen</button>
        </div>
    </div>

    <p id="status"></p>
</div>

<script src="script.js"></script>
